[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binaa-compare"
version = "0.1.0"
description = "Compare two RIM-Soft account statements. Offline and local only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["openpyxl>=3.1,<4", "sv-ttk>=2.6,<3", "pdfminer.six>=20231228"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "types-openpyxl>=3.1", "reportlab>=4"]

[project.gui-scripts]
binaa-compare = "binaa_reconciler.compare.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S"]
# RUF001-003: Arabic / typographic characters are intentional in this domain.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
